# Dev compose — app services only, wired against the in-process simulator.
#
# Infrastructure (TimescaleDB, Grafana, Tempo, Prometheus, OTel Collector)
# lives in the root `docker-compose.yaml`; bring it up first so the
# `rice-shower` network and the `tsdb` / `otel-collector` services exist:
#
#   docker compose -f docker-compose.yaml up -d
#   docker compose -f deployment/docker-compose.dev.yaml up -d
#
# The external network `rice-shower` is created by the root compose. Each
# service here attaches to it explicitly so it can reach `tsdb`,
# `otel-collector`, etc. by service name.
#
# Env vars are inlined here (no env_file) so the inline `# comments` in
# the per-app .env.dev files don't get parsed as part of values.
#
# Differences from docker-compose.yaml:
#   - includes the `simulator` service
#   - ls-api runs against the simulator (presence of SIMULATOR_API_URL
#     triggers MockModel240); no /dev/ttyACM0 is needed
#   - heater-api uses HEATER_MODE=MOCK; no /dev/ttyUSB0 is needed.
#     The MOCK heater delegates power state to the simulator
#
# `localhost` override: the systems table in the rice-shower DB stores
# `thermoUrl` / `heaterUrl` as `http://localhost:8000` / `http://localhost:8001`
# so that `pnpm dev` works out of the box. Both `web` and `rice-shower` read
# those URLs and call the APIs server-side, so they need `localhost` to
# point at the host (where ls-api/heater-api publish their ports) instead
# of the container itself. We do that with `extra_hosts: localhost:host-gateway`,
# which prepends an /etc/hosts entry that wins over the default 127.0.0.1.

networks:
  rice-shower:
    external: true

services:
  simulator:
    build:
      context: ..
      dockerfile: apps/simulator/Dockerfile
    image: lt-capstone/simulator:latest
    container_name: rice-simulator-dev
    environment:
      LGG_URL: http://ls-api:8000
      CONFIG_FILE: /app/config.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8101:8101"
    volumes:
      - ../apps/simulator/config.yaml:/app/config.yaml:ro
    networks:
      - rice-shower
    restart: unless-stopped

  ls-api:
    build:
      context: ..
      dockerfile: apps/ls-api/Dockerfile
    image: lt-capstone/ls-api:latest
    container_name: rice-ls-api-dev
    environment:
      ENVIRONMENT: DEVELOPMENT
      SIMULATOR_API_URL: http://simulator:8101
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      - simulator
    networks:
      - rice-shower
    restart: unless-stopped

  heater-api:
    build:
      context: ..
      dockerfile: apps/heater-api/Dockerfile
    image: lt-capstone/heater-api:latest
    container_name: rice-heater-api-dev
    environment:
      ENVIRONMENT: DEVELOPMENT
      HEATER_MODE: MOCK
      LGG_URL: http://ls-api:8000
      SIMULATOR_API_URL: http://simulator:8101
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8001:8001"
    volumes:
      - ../apps/heater-api/config.yaml:/workspace/apps/heater-api/config.yaml:ro
      - heater-dev-state:/data
    depends_on:
      - ls-api
      - simulator
    networks:
      - rice-shower
    restart: unless-stopped

  rice-shower:
    build:
      context: ..
      dockerfile: apps/rice-shower/Dockerfile
    image: lt-capstone/rice-shower:latest
    container_name: rice-shower-dev
    environment:
      DATABASE_URL: postgresql://postgres:password@tsdb:5432/lt_capstone_v2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8100:8100"
    depends_on:
      - ls-api
      - heater-api
    networks:
      - rice-shower
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: lt-capstone/web:latest
    container_name: rice-web-dev
    environment:
      RICE_SHOWER_URL: http://rice-shower:8100
    ports:
      - "3100:3100"
    depends_on:
      - rice-shower
    networks:
      - rice-shower
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped

volumes:
  heater-dev-state:
    driver: local
    name: rice-heater-dev-state
